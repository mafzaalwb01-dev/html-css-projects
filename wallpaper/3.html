<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .canvas {
            width: 500px;
            height: 400px;
            background: linear-gradient(#2c3e50, #fd746c);
            /* Night to Sunset gradient */
            position: relative;
            overflow: hidden;
            border: 10px solid #333;
            margin: 50px auto;
        }

        .sun {
            width: 120px;
            height: 120px;
            background-color: #f1c40f;
            border-radius: 50%;
            /* Makes it a circle */
            position: absolute;
            top: 150px;
            left: 190px;
            box-shadow: 0 0 50px #f39c12;
        }


        .ocean {
            width: 100%;
            height: 120px;
            background-color: #2980b9;
            position: absolute;
            bottom: 0;
            opacity: 0.8;
        }


        .art-title {
            position: absolute;
            width: 100%;
            text-align: center;
            bottom: 20px;
            color: white;
            font-family: 'Georgia', serif;
            font-size: 24px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="canvas">
        <div class="sun"></div>
        <div class="ocean"></div>
        <h1 class="art-title">Golden Hour</h1>
    </div>
</body>

</html>
