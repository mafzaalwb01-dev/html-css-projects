<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p style="border: 5px dashed yellowgreen;">This is a dashed border</p>
    <p style="border: 5px dotted darkblue;">This is a dotted border</p>
    <p style="border: 5px groove pink;">This is a groove border</p>
    <p style="border: 5px ridge lightblue;">This is a ridge border</p>
    <p style="border: 5px inset gray;">This is a inset border</p>
    <p style="border: 5px hidden green;">This is a hidden border</p>
    <p style="border: 5px solid hotpink;">This is a solid border</p>
    <p style="border: 5px double darksalmon">This is a double border</p>
    <p style="border: 5px none rgb(230, 193, 168);">This is a none border</p>
    <p style="border: 5px outset rgb(169, 101, 52);">This is a none border</p>
</body>

</html>
